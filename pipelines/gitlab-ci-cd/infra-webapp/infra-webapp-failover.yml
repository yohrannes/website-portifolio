
### Need to implement a way to build that instance OCID using packer and
# get the OCID of this instance using TERRAFORM CLOUD to be used in this
# terraform pipeline. .

## Instance used for failover if k8s_cluster goes down.
---
include:
  - local: 'pipelines/gitlab-ci-cd/terraform/trigger-run.yml'
  - local: 'pipelines/gitlab-ci-cd/terraform/apply.yml'

variables:
  TF_WORKSPACE: "webapp_prod"
  TF_TARGET_ADDRS: 'module.webapp_failover'

trigger-terraform-run:
  stage: tf-run
  tags:
    - runner1
  extends:
    - .trigger-terraform-run

terraform-apply:
  stage: tf-apply
  tags:
    - runner1
  extends: .terraform-apply
  needs:
    - trigger-terraform-run

get-instance-ip:
  stage: check-infra
  tags:
    - runner1
  script:
    - |
      WORKSPACE_ID=$(curl -s \
        --header "Authorization: Bearer $TF_CLOUD_TOKEN" \
        --header "Content-Type: application/vnd.api+json" \
        "https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORG/workspaces/$TF_WORKSPACE" \
        | jq -r '.data.id')

    - |
      STATE_VERSION_ID=$(curl -s \
        --header "Authorization: Bearer $TF_CLOUD_TOKEN" \
        --header "Content-Type: application/vnd.api+json" \
        "https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORG/workspaces/$TF_WORKSPACE" \
        | jq -r '.data.relationships["current-state-version"].data.id')
    
    - |
      INSTANCE_PUBLIC_IP=$(curl -s \
        --header "Authorization: Bearer $TF_CLOUD_TOKEN" \
        --header "Content-Type: application/vnd.api+json" \
        "https://app.terraform.io/api/v2/state-versions/$STATE_VERSION_ID/outputs" \
        | jq -r '.data[] | select(.attributes.name == "webapp_failover_pub_ip") | .attributes.value')

      if [ -z "$INSTANCE_PUBLIC_IP" ] || [ "$INSTANCE_PUBLIC_IP" = "null" ]; then
        echo "ERROR: Failed to extract IP address"
        exit 1
      fi
    
    - |
      RESPONSE=$(curl -s --write-out "\n%{http_code}" \
        --header "PRIVATE-TOKEN: $GL_TOKEN_VARS_ADMIN" \
        --request PUT \
        --form "value=$INSTANCE_PUBLIC_IP" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/PROD_WEBAPP_FAILOVER_IP") >  /dev/null 2>&1
      
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      echo "HTTP Status: $HTTP_CODE"
      
      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: Failed to update GitLab variable"
        exit 1
      fi

    - |
      RESPONSE=$(curl -s --write-out "\n%{http_code}" \
        --header "PRIVATE-TOKEN: $GL_TOKEN_VARS_ADMIN" \
        --request PUT \
        --form "value=$INSTANCE_PUBLIC_IP" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/PROD_RUNNER2_IP") >  /dev/null 2>&1
      
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      echo "HTTP Status: $HTTP_CODE"
      
      if [ "$HTTP_CODE" != "200" ]; then
        echo "ERROR: Failed to update GitLab variable"
        exit 1
      fi

check-startup-script:
  stage: check-infra
  tags:
    - runner1
  needs:
    - get-instance-ip
  script:
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - |
      sleep 15
      while true; do
        ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=30 \
            -i ~/.ssh/id_rsa \
            ubuntu@$PROD_WEBAPP_FAILOVER_IP \
            "timeout 300 bash -c '
              while true; do
                if [ -f /var/log/startup-script.log ] && [ -r /var/log/startup-script.log ]; then
                  if tail -n1 /var/log/startup-script.log 2>/dev/null | grep \"startup-script-finished\"; then
                    echo \"Startup script finished!\"
                    exit 0
                  fi
                else
                  echo \"Waiting for startup script log...\"
                fi
                sleep 3
              done
            '" && break || echo 'Retrying connection in 5 seconds...'
        sleep 5
      done


      " > /dev/null

      
      

