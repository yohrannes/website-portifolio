---
variables:
  DOCKER_BUILDKIT: "1"

### Task: implement CI_COMMIT_MESSAGE ci var to be used in new tag version.

define-version:
  stage: deploy-image
  script:
    - OLD_TAG=$(./usefull-scripts/old-dk-img-version.sh "$IMG_NAME")
    - NEW_TAG=v$(./usefull-scripts/nx-dk-img-version.sh "$OLD_TAG" patch)
    - echo "NEW_TAG=$NEW_TAG" >> version.env
  artifacts:
    reports:
      dotenv: version.env

.build-all-targets: &build-all-targets
  - |

    while IFS='|' read -r CTX_DIR IMG_NAME; do
      [ -z "$CTX_DIR" ] && continue

      echo "=== Build $IMG_NAME ($CTX_DIR) [$ARCH] ==="

      pushd "$CI_PROJECT_DIR/repos-git/$CI_PROJECT_NAME/$CTX_DIR" > /dev/null
      docker pull "$IMG_NAME:latest" || true
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMG_NAME:latest" \
        -t "$IMG_NAME:$NEW_TAG-$ARCH" \
        .
      docker push "$IMG_NAME:$NEW_TAG-$ARCH"
      popd > /dev/null
    done <<< "$(echo "$IMAGE_TARGETS" | tr -d '\r')"

deploy-dk-hub-amd:
  stage: deploy-image
  needs:
    - job: define-version
      artifacts: true
  tags: [ "runner1" ]
  variables:
    ARCH: amd64
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - mkdir -p repos-git && cd repos-git
    - git clone $CI_REPOSITORY_URL
    - cd $CI_PROJECT_NAME
    - curl -L ${APP_REP}/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 "${APP_REP_NAME}-main/docker-compose"
    - git checkout docker-registry
    - *build-all-targets

deploy-dk-hub-arm:
  stage: deploy-image
  needs:
    - job: define-version
      artifacts: true
  tags: [ "runner2" ]
  variables:
    ARCH: arm64
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - mkdir -p repos-git && cd repos-git
    - git clone $CI_REPOSITORY_URL
    - cd $CI_PROJECT_NAME
    - curl -L ${APP_REP}/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 "${APP_REP_NAME}-main/docker-compose"
    - git checkout docker-registry
    - *build-all-targets

deploy-dk-hub:
  stage: deploy-image
  tags: [ "runner2" ]
  needs:
    - deploy-dk-hub-amd
    - deploy-dk-hub-arm
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - |
      while IFS='|' read -r CTX_DIR IMG_NAME; do
        [ -z "$CTX_DIR" ] && continue
        docker pull --platform linux/amd64 "$IMG_NAME:${NEW_TAG}-amd64"
        docker image ls | grep ${NEW_TAG}
        docker pull --platform linux/arm64 "$IMG_NAME:${NEW_TAG}-arm64"
        docker image ls | grep ${NEW_TAG}
        docker buildx imagetools create \
          -t "$IMG_NAME:${NEW_TAG}" \
          -t "$IMG_NAME:latest" \
          "$IMG_NAME:${NEW_TAG}-amd64" \
          "$IMG_NAME:${NEW_TAG}-arm64"
      done <<< "$(echo "$IMAGE_TARGETS" | tr -d '\r')"

    - echo "New version $NEW_TAG"

# Feature task
# Assign image with cosign job
# ex: cosign sign -key ../../cosign-keys/cosign.key $IMG_NAME

