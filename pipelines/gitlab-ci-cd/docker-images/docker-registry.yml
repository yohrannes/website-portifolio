---
variables:
  DOCKER_BUILDKIT: "1"
  IMAGE_TAG: latest

## Example
## dockerfile-dir|docker-image-name

  IMAGE_TARGETS: |
    docker-compose/webport|yohrannes/website-portifolio
    docker-compose/nginx|yohrannes/nginx

.build-all-targets: &build-all-targets
  - |
    VERSION_LOCKED=false
    while IFS='|' read -r CTX_DIR IMG_NAME; do
      [ -z "$CTX_DIR" ] && continue
      echo "=== Build $IMG_NAME ($CTX_DIR) [$ARCH] ==="

      if [ "$VERSION_LOCKED" = false ]; then
        OLD_TAG=$(./usefull-scripts/old-dk-img-version.sh $IMG_NAME)
        NEW_TAG=v$(./usefull-scripts/nx-dk-img-version.sh $OLD_TAG patch) # major | minor | patch | v0.0.0

        curl --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --request PUT \
          --form "value=$OLD_TAG" \
          "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/DOCKER_IMAGE_ACTUAL_TAG" \
          > /dev/null 2>&1

        curl --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          --request PUT \
          --form "value=$NEW_TAG" \
          "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/variables/DOCKER_IMAGE_NEW_TAG" \
          > /dev/null 2>&1

        VERSION_LOCKED=true
      fi

      pushd "$CI_PROJECT_DIR/repos-gitlab/website-portifolio/$CTX_DIR" > /dev/null
      docker pull "$IMG_NAME:latest" || true
      docker build \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "$IMG_NAME:latest" \
        -t "$IMG_NAME:$NEW_TAG-$ARCH" \
        .
      docker push "$IMG_NAME:$NEW_TAG-$ARCH"
      popd > /dev/null
    done <<< "$IMAGE_TARGETS"

deploy-dk-hub-amd:
  stage: deploy-image
  needs: [ "get-image-tag" ]
  tags: [ "runner1" ]
  variables:
    ARCH: amd64
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - mkdir -p repos-gitlab && cd repos-gitlab
    - git clone $CI_REPOSITORY_URL
    - cd website-portifolio
    - curl -L https://github.com/yohrannes/yohrannes.com/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 "yohrannes.com-main/docker-compose"
    - git checkout docker-registry
    - *build-all-targets

deploy-dk-hub-arm:
  stage: deploy-image
  needs: [ "get-image-tag" ]
  tags: [ "runner2" ]
  variables:
    ARCH: arm64
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - mkdir -p repos-gitlab && cd repos-gitlab
    - git clone $CI_REPOSITORY_URL
    - cd website-portifolio
    - curl -L https://github.com/yohrannes/yohrannes.com/archive/refs/heads/main.tar.gz | tar -xz --strip-components=1 "yohrannes.com-main/docker-compose"
    - git checkout docker-registry
    - *build-all-targets

deploy-dk-hub:
  stage: deploy-image
  tags: [ "runner2" ]
  needs:
    - deploy-dk-hub-amd
    - deploy-dk-hub-arm
  before_script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USER" --password-stdin
  script:
    - NEW_TAG=$DOCKER_IMAGE_NEW_TAG
    - |
      while IFS='|' read -r CTX_DIR IMG_NAME; do
        [ -z "$CTX_DIR" ] && continue
        docker buildx imagetools create \
          -t "$IMG_NAME:$NEW_TAG" \
          -t "$IMG_NAME:latest" \
          "$IMG_NAME:$NEW_TAG-amd64" \
          "$IMG_NAME:$NEW_TAG-arm64"
      done <<< "$IMAGE_TARGETS"
    - echo "Old version $DOCKER_IMAGE_ACTUAL_TAG changed to the new version $NEW_TAG"

# Assign image with cosign job
#  cosign sign -key ../../cosign-keys/cosign.key yohrannes/website-portifolio

